peak_extraction_method:
  default: weighted_centroid_intensity
  options:
    - top_peak_max
    - top5_mean
    - top5_mean_peak_marker
    - window_integrated_intensity
    - weighted_centroid_intensity
    - parabolic_peak_fit

p22_spectral_feature_mode:
  mode: auto
  options: [peak, dip, auto]

auto_peak_finder:
  enabled: true
  wavelength_min_nm: 1538.0
  wavelength_max_nm: 1582.0
  expected_peak_count: 9
  min_peak_distance_nm: 3.0
  max_peak_distance_nm: 7.0
  min_prominence_ratio: 0.03
  min_height_ratio: 0.05
  smoothing_window_points: 7
  max_allowed_offset_nm: 1.5
  peak_width_min_nm: 0.02
  peak_width_max_nm: 2.0
  peak_snr_min: 3.0
  min_abs_peak_intensity_counts: 100
  min_match_peak_snr: 0.75
  reject_zero_intensity_peaks: true
  reject_dark_region_peaks: true
  reject_peak_width_abnormal: warning_only
  baseline_subtraction: true
  allow_manual_review: true

array_coupling:
  enabled: false
  model_type: none
  simulation_model_type: shared_elastomer_mechanical_shift_proxy
  calibration_matrix_file:
  coupling_status: uncalibrated_mechanically_coupled_wavelength_shift
  coupling_compensated: false
  coupling_sources:
    - shared_elastomer_mechanical_coupling
    - fingertip_contact_area_coverage
  calibration_required: true
  notes: >
    Wavelength-shift mode does not reuse the directional same-fiber optical
    attenuation cascade from the intensity edition. Simulated neighboring
    responses represent only contact-area coverage and mechanical coupling.

baseline:
  default_mode: frozen_baseline
  available_modes: [manual_latest, frozen_baseline]
  semantic_role: post_press_release_recovery_no_contact
  operator_instruction: release contact, wait for the spectrum to stabilize, then set baseline
  rolling_window_sec: 2.0
  rolling_min_samples: 20
  full_spectrum_minimum_samples: 20
  full_spectrum_minimum_span_sec: 0.6
  full_spectrum_noise_warning_ratio: 0.01
  full_spectrum_noise_fail_ratio: 0.04
  full_spectrum_drift_warning_ratio: 0.015
  full_spectrum_drift_fail_ratio: 0.06
  noise_warning_ratio: 0.04
  noise_fail_ratio: 0.12

quality:
  dark_count_max: 20
  saturation_count_min: 65000
  saturation_fraction_warning: 0.02
  low_signal_relative_warning: 0.05
  peak_edge_margin_points: 3

surface:
  default_display_mode: raw_coupled_wavelength_shift_surface
  visualization_mode_default: physical_proxy
  surface_input_mode: raw_coupled_response_surface
  surface_grid_size: 80
  surface_sigma: 0.38
  surface_clip_min: 0
  surface_clip_max: 1
  active_threshold: 0.02
  active_absolute_threshold: 0.04
  active_relative_threshold: 0.25
  fallback_note: single-point P22 wavelength-shift fallback, not measured 3x3 array
