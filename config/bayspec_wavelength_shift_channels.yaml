app:
  mode: bayspec_global_9fbg_hybrid_spectral_fingerprint
  edition: wavelength_shift_demodulation
  recognition_scope: global_3x3_hybrid_spectral_fingerprint
  array_mode: global_spectrum_unmapped
  default_channel: null
  carrier_channel: P22
  carrier_channel_role: legacy_full_spectrum_transport_only
  primary_signal: full_spectrum_9fbg_mixed_wavelength_intensity_shape
  physical_channel_mapping_final: false
  real_3x3_enabled: false
  calibrated_force_output: false
  calibrated_pressure_output: false
  strain_temperature_decoupled: false

wavelength_shift_demodulation:
  primary_method: cross_correlation
  fallback_method: weighted_centroid
  consistency_method: parabolic_peak_fit
  feature_mode: auto
  search_half_width_nm: 0.8
  maximum_correlation_shift_pm: 500.0
  minimum_cross_correlation: 0.65
  estimator_disagreement_warning_pm: 80.0
  frame_jump_warning_pm: 300.0
  visualization_full_scale_pm: 500.0
  baseline_noise_warning_pm: 8.0
  temperature_strain_decoupled: false
  interpretation: uncalibrated Bragg wavelength displacement; strain and temperature are coupled
  response_thresholds_pm:
    no_contact_max_abs_shift_pm: 10.0
    small_shift_max_abs_pm: 75.0
    moderate_shift_max_abs_pm: 250.0
    noise_gate_k: 3.0

global_candidate_baseline:
  enabled: true
  minimum_unique_frames: 30
  maximum_latest_ingest_age_sec: 2.5
  minimum_ingest_span_sec: 0.5
  require_single_source: true
  expected_candidate_count: 9
  maximum_candidate_noise_pm_warning: 8.0
  maximum_candidate_range_pm: 30.0
  maximum_candidate_frame_jump_pm: 15.0
  reject_unstable_baseline: true
  scope: display_and_diagnostics_only
  note: Formal hybrid-model inference uses its own stricter full-spectrum baseline gate.

array_wavelength_plan:
  wavelength_unit: nm
  wavelength_start_nm: 1540.0
  wavelength_stop_nm: 1580.0
  wavelength_spacing_nm: 5.0
  number_of_fbg_peaks: 9
  status: preliminary_target_plan
  note: "Target wavelengths are preliminary and must be replaced by measured no-contact Bragg wavelengths after fabrication."

profiles:
  single_p22_existing:
    description: Current single-point P22 fallback using a provisional manual no-contact wavelength.
    array_enabled: false
    real_3x3_enabled: false
    channel_ids: [P22]
  future_3x3_plan:
    description: Future preliminary 9-FBG wavelength-shift plan.
    array_enabled: false
    real_3x3_enabled: false
    channel_ids: [P11, P12, P13, P21, P22, P23, P31, P32, P33]
  current_real_9fbg_candidate:
    description: Current live 100-frame nine-FBG cluster; channel identities require labelled point-press confirmation.
    array_enabled: false
    real_3x3_enabled: false
    channel_ids: [P11, P12, P13, P21, P22, P23, P31, P32, P33]

