schema_version: ordinary_fbg_px6d_training_v3_incremental

data:
  dataset_id: ordinary_fbg_px6d_20260902_v01922_blind3_unblinded_incremental_v1
  source_policy: strict_base_plus_unblinded_blind3_incremental
  formal_group_field: session_id
  split_strategy: grouped_by_complete_session_id
  random_frame_split_allowed: false
  historical_data_policy: same_day_high_sensitivity_300us_only
  blind3_status: labelled_training_data_filename_not_obfuscated_not_independent_test

acquisition:
  sensor_mode_code: 0
  sensor_mode_label: High Sensitivity
  integration_us: 300

baseline:
  search_fraction: 0.20
  maximum_force_n: 0.03
  minimum_frames: 5
  fallback_lowest_force_frames: 10

labels:
  no_contact_max_force_n: 0.03
  contact_min_force_n: 0.10
  position_min_force_n: 0.25
  position_order: [P11, P21, P31, P12, P22, P32, P13, P23, P33]

quality:
  release_tail_warning_code: release_recovery_residual
  release_tail_exclusion_fraction: 0.15
  minimum_frames_per_session: 20
  maximum_sync_offset_ms: 250.0

features:
  downsample_bins: 64
  feature_sets:
    baseline_relative_192:
      include_derivative: false
      include_global_summary: false
    baseline_relative_264:
      include_derivative: true
      include_global_summary: true

evaluation:
  folds: 5
  random_seed: 42
  session_level_position_voting: true
  training_weight_strategy: equal_session_mass
  classification_class_weight: balanced
  mixed_position_sessions: frame_metrics_only_excluded_from_session_majority_vote

compute:
  preferred_accelerators: [cuda, directml, npu]
  cpu_threads: 8
  note: current tree candidates are CPU-bound; complete-session grouping is mandatory

models:
  candidate_model_types:
    - extra_trees
    - random_forest
    - lightgbm
    - hist_gradient_boosting
  candidate_model_types_by_task:
    contact: [extra_trees, lightgbm, hist_gradient_boosting]
    position: [extra_trees, random_forest, lightgbm, hist_gradient_boosting]
    force: [extra_trees, lightgbm, hist_gradient_boosting]
  cross_validation_tree_estimators: 160
  final_tree_estimators: 320
  minimum_leaf_samples: 2
  candidate_only: true
  deployment_status: candidate_not_deployed_pending_grouped_oof_and_live_validation
