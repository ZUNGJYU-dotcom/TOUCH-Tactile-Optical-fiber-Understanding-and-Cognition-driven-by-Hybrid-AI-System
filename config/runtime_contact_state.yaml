schema_version: touch_runtime_contact_state_v1

# Establish the optical reference from the current acquisition session before
# the learned model is allowed to drive the twin. Five stable physical spectra
# are enough to reject stale cross-session references without adding a long
# warm-up at the direct-SDK frame rate.
runtime_startup_baseline:
  enabled: true
  minimum_frames: 5
  minimum_span_sec: 0.12
  max_shape_motion_rms: 0.0060
  max_common_gain_motion: 0.0060
  maximum_force_abs_n: 0.10
  require_force_release_if_available: true
  policy: current_session_stable_five_frame_median

runtime_baseline_recovery:
  enabled: true

  # The temporal model expects 20 samples at 40 ms intervals, while the stable
  # direct-SDK path typically yields one physical spectrum about every 0.4 s.
  # Seed the history with the confirmed no-contact baseline so the first new
  # physical frame can be classified instead of waiting through warm-up.
  prime_temporal_history_with_baseline: true
  baseline_preroll_frames: 20

  # Direct-SDK no-contact observations remain near 0.003 shape RMS, while the
  # measured release tail remains below about 0.0041. These limits leave margin
  # without treating ordinary stationary jitter as fresh contact activity.
  max_shape_motion_rms: 0.0045
  max_common_gain_motion: 0.0030
  activity_shape_motion_rms: 0.0060
  activity_common_gain_motion: 0.0060

  # Quietness is supporting evidence, never the only release decision.
  quiet_hold_sec: 0.5
  minimum_quiet_physical_frames: 2
  release_candidate_timeout_sec: 12.0

  # A release candidate is armed only after credible contact and a subsequent
  # release transition supported by model, raw demodulation, or recovery trend.
  contact_probability_arm: 0.65
  contact_arm_physical_frames: 2
  minimum_contact_baseline_distance: 0.0060
  # A slow press may stay below the per-frame activity threshold. Allow it to
  # re-arm only when distance from the runtime baseline is still increasing;
  # position confidence alone is never contact evidence.
  minimum_contact_distance_growth: 0.0005
  release_probability_threshold: 0.40
  no_contact_probability_support: 0.55
  minimum_recovery_fraction: 0.20
  minimum_contact_probability_drop: 0.15
  minimum_spatial_contact_confidence: 0.60
  minimum_slow_release_recovery_fraction: 0.45
  release_activity_memory_sec: 2.0

  # Recovery fallback for an already released sensor when the release edge was
  # missed. Stationarity and a no-contact label are not enough because a held
  # press can satisfy both after a classifier dip. The spectrum must already
  # be close to the accepted runtime baseline; larger residuals need a measured
  # release/recovery trajectory or an explicit operator baseline.
  stationary_rest_fallback_enabled: true
  stationary_rest_candidate_delay_sec: 1.0
  stationary_rest_max_baseline_distance: 0.0050
  fallback_requires_new_contact_after_reanchor: true

  # Cancel a pending release if a new active change moves away from the quiet
  # recovery cluster. This prevents automatic baseline capture during re-press.
  recontact_probability_threshold: 0.75
  recontact_distance_growth_fraction: 0.15
  recontact_distance_growth_absolute: 0.0040

  auto_update_runtime_baseline: true
  policy: multi_evidence_release_then_half_second_spectral_stationarity

# The response classifier remains the primary decision source. This postprocess
# only resolves a narrow light/normal probability tie that was validated with
# grouped out-of-fold predictions from the existing 27 dynamic sequences.
response_level_postprocess:
  enabled: true
  light_preference:
    only_override_raw_label: normal
    minimum_light_probability: 0.40
    maximum_normal_minus_light_margin: 0.10
    require_hard_not_dominant: true
  semantics: grouped_oof_validated_borderline_light_preference_not_force_N

# Primary Beta all-source runtime guard. The grouped model remains the learned
# decision source, while the live guard prevents stable common-mode drift and
# spatially ambiguous residuals from driving the digital twin.
all_source_runtime_gate:
  enabled: true
  contact_probability_off: 0.55

  # Grouped OOF position predictions retain 96.2% coverage and about 99.8%
  # accuracy at confidence >= 0.45. A margin check rejects tied corner guesses.
  position_confidence_min: 0.45
  position_margin_min: 0.08
  # A verified contact may still animate at the best low-confidence location.
  # Formal position output remains unaccepted until the stricter thresholds pass.
  visual_position_fallback_enabled: true
  visual_position_confidence_min: 0.18
  visual_position_margin_min: 0.015
  # A single spatial spike must not seize the twin location. The same visual
  # position must be observed in two consecutive physical spectra.
  visual_position_confirm_frames: 2

  # The operator twin has a separate low-force visual gate. It cannot change
  # the formal contact decision, and still requires a baseline-separated,
  # time-varying spectrum plus a credible location. Hysteresis keeps a light
  # touch visible without allowing quiet baseline drift to animate the pad.
  visual_contact_probability_on: 0.35
  visual_contact_probability_off: 0.20
  visual_force_on_n: 0.08
  visual_force_off_n: 0.03
  visual_force_full_scale_n: 2.5
  visual_force_gamma: 0.55
  visual_deformation_floor: 0.12
  # Low-force visual activation also requires two consecutive physical
  # spectra. This adds only one acquisition cycle while rejecting idle spikes.
  visual_contact_arm_frames: 2
  position_probability_ema_alpha: 0.55
  position_hold_sec: 0.75
  position_switch_frames: 2

  # A learned contact must also differ physically from the accepted no-contact
  # baseline. Returning near the baseline for two quiet frames clears a stale
  # model latch even when the position classifier remains overconfident.
  require_baseline_separation: true
  baseline_release_distance: 0.0050
  release_near_baseline_frames: 2

  # A new formal press can still be evaluated on its first physical spectrum;
  # the low-force visual path and every new location require two-frame
  # confirmation. Stable, spatially ambiguous output is preserved across brief classifier dips, but
  # is released after one second without fresh spectral activity. This clears
  # residual drift without using position confidence as an immediate release.
  contact_arm_physical_frames: 1
  ambiguous_quiet_release_sec: 1.0
  # Retained for backward-compatible diagnostics; release timing is in seconds.
  release_ambiguous_frames: 2
  activity_memory_sec: 1.25
  activity_shape_motion_rms: 0.0060
  activity_common_gain_motion: 0.0060
