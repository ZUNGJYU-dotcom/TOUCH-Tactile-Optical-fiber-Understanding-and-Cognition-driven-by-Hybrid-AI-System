enabled: true
auto_start: true

serial:
  port: COM3
  auto_detect_port: true
  usb_vid: 0x1A86
  usb_pid: 0x55D3
  usb_serial_number: "5C7B025505"
  port_description_contains: CH343
  baud_rate: 921600
  device_id: 127
  poll_hz: 50.0
  read_timeout_sec: 0.20
  reconnect_interval_sec: 1.0
  reconnect_max_interval_sec: 8.0
  reconnect_backoff_multiplier: 2.0
  port_busy_backoff_sec: 5.0
  isolate_process: true
  worker_watchdog_sec: 1.5
  worker_stop_timeout_sec: 0.5
  device_settle_sec: 0.20
  handshake_timeout_sec: 0.40
  handshake_attempts: 3

signal:
  history_seconds: 300.0
  compression_sign: -1
  filter_alpha: 0.25
  median_window_samples: 5
  deadband_n: 0.015
  stationary_window_sec: 1.0
  stationary_std_max_n: 0.008
  stationary_range_max_n: 0.030
  stationary_slope_max_n_per_sec: 0.025
  auto_zero_drift_enabled: true
  auto_zero_hold_sec: 1.5
  auto_zero_capture_limit_n: 0.060
  auto_zero_release_reacquire_limit_n: 0.30
  auto_zero_alpha: 0.015
  maximum_drift_offset_n: 0.50
  note: "Median despiking and low-pass filtering are applied to all six axes. Positive compression zero tracking remains limited to the Fz near-zero band; stable release-side Fz drift may reacquire zero up to the configured limit. Raw and software-zeroed values remain unchanged in exports."

mechanical:
  primary_axis: Fz
  force_full_scale_per_axis_n: 50.0
  moment_full_scale_per_axis_nm: 2.0
  warning_utilization_percent: 90.0
  note: "Configured nominal PX6D-75 axis ranges; raw and software-zeroed values are both retained."

software_tare:
  auto_tare_on_start: false
  duration_sec: 1.0
  maximum_fz_std_n: 0.12
  note: "Software zero only; the PX6D hardware calibration command is never sent. Tare is operator initiated so a real load cannot be silently absorbed at startup."

synchronization:
  force_window_half_width_sec: 0.25
  maximum_nearest_sample_age_sec: 0.25
  timestamp_basis: host_epoch_clock
  aggregation: median
  excellent_max_offset_ms: 50.0
  good_max_offset_ms: 150.0
  acceptable_max_offset_ms: 250.0

capture:
  output_directory: data/px6d_synchronized
  poll_interval_sec: 0.01
  durable_flush_interval_sec: 0.25
  durable_flush_frame_count: 10
  require_software_tare: true
  require_valid_spectrum: true
  default_selected_outputs:
    - spectrum
    - response
    - force
  available_outputs:
    - spectrum
    - response
    - force
  canonical_timeline_keys:
    - capture_index
    - timeline_timestamp_epoch_sec
    - elapsed_time_sec
  note: "The user may save any one, two, or all three streams. Selected files share one canonical timeline; optical-driven captures require PX6D alignment within 250 ms and freeze force auto-zero adaptation until recording stops."

semantics:
  primary_display_axis: Fz
  display_name: PX6D Reference Fz
  optical_model_role: synchronized_ground_truth_reference
  note: "This is the measured PX6D reference force, not an optical force prediction."
